[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelguard"
version = "0.1.0"
description = "Continuous, read-only, offline-first security companion for PHP, Python and JavaScript projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []            # standard library only, on purpose: nothing to compromise

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["data/*.json"]
